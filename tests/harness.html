<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../popup/popup.css">
  <script>
    window.__fixtureRecipe = {
      name: 'Soft Chocolate Chip Cookies',
      ingredients: [
        '3/4 cup unsalted butter, softened to room temperature',
        '3/4 cup packed light or dark brown sugar',
        '1/4 cup granulated sugar',
        '1 large egg, at room temperature',
        '2 teaspoons pure vanilla extract',
        '2 cups all-purpose flour',
        '1 teaspoon baking soda',
        '1/2 teaspoon salt',
        '1 cup milk',
        '1 1/4 cups chocolate chips'
      ],
      steps: [
        'Cream the butter with both sugars for about 2 minutes, then mix in the egg and vanilla.',
        'Whisk the flour, baking soda and salt in a second bowl, add to the butter mixture and stir in the chocolate chips.',
        'Cover the dough and chill it in the fridge for at least 1 hour.',
        'Let the dough stand at room temperature for 10 minutes and preheat the oven to 350°F.',
        'Scoop the dough into balls and space them 3 inches apart on lined baking sheets.',
        'Bake for 11–12 minutes, until the edges just start to turn golden.',
        'Cool on the sheet for 5 minutes, then move the cookies to a rack.'
      ],
      prep: 75,
      cook: 12,
      total: 90,
      groups: [
        { name: null, start: 0, count: 8 },
        { name: 'Filling', start: 8, count: 2 }
      ],
      servings: '24 cookies',
      nutrition: { calories: 270, fat: 13, carbs: 34, protein: 4, servingSize: '1 cookie' },
      source: 'https://example.com/cookies'
    };
    window.chrome = {
      storage: {
        local: {
          get: async () => ({
            log: [{ url: 'https://example.com/a' }, { url: 'https://example.com/b' }],
            misses: [{ url: 'https://example.com/c' }],
            devLogging: true
          })
        }
      }
    };
    window.__copied = null;
    Object.defineProperty(navigator, 'clipboard', {
      value: { writeText: t => { window.__copied = t; return Promise.resolve(); } }
    });
  </script>
</head>
<body>
  <div id="empty" class="empty hidden">
    <div class="empty-mark">◌</div>
    <p class="empty-title" id="empty-title">No recipe here</p>
    <p class="empty-hint" id="empty-hint">Open a recipe page and the icon will show a ✓ when one is found.</p>
  </div>
  <div id="recipe" class="hidden">
    <header class="head">
      <p class="eyebrow">Recipe</p>
      <h1 id="name"></h1>
      <div id="meta" class="chips"></div>
      <p id="nutrition" class="nutrition hidden"></p>
    </header>
    <div class="controls">
      <div class="group" id="system">
        <button data-system="original" class="active">Original</button>
        <button data-system="metric">Metric</button>
      </div>
      <div class="group" id="scale">
        <button data-factor="1/4">¼×</button>
        <button data-factor="1/3">⅓×</button>
        <button data-factor="1/2">½×</button>
        <button data-factor="1" class="active">1×</button>
        <button data-factor="2">2×</button>
        <button data-factor="3">3×</button>
      </div>
    </div>
    <section>
      <h2>Ingredients</h2>
      <ul id="ingredients" class="ing"></ul>
    </section>
    <section id="steps-section">
      <h2>Instructions</h2>
      <ol id="steps" class="steps"></ol>
    </section>
    <footer class="foot">
      <button id="copy" class="copy">Copy as Markdown</button>
      <button id="print" class="print">Print</button>
    </footer>
  </div>
  <p id="log-status" class="log hidden"><span id="log-count"></span> · <a href="#" id="log-export">Export log</a></p>
  <script src="../lib/parser.js"></script>
  <script src="../lib/convert.js"></script>
  <script src="../lib/extractor.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../popup/popup.js"></script>
</body>
</html>
