<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cook harness</title>
  <link rel="stylesheet" href="../cook/cook.css">
  <script>
    window.__cookFixture = {
      system: 'metric',
      factor: 1,
      recipe: {
        name: 'Soft Chocolate Chip Cookies',
        ingredients: [
          '3/4 cup unsalted butter, softened to room temperature',
          '3/4 cup packed light or dark brown sugar',
          '1/4 cup granulated sugar',
          '1 large egg, at room temperature',
          '2 teaspoons pure vanilla extract',
          '2 cups all-purpose flour',
          '1 teaspoon baking soda',
          '1/2 teaspoon salt',
          '1 cup milk',
          '1 1/4 cups chocolate chips'
        ],
        steps: [
          'Cream the butter with both sugars for about 2 minutes, then mix in the egg and vanilla.',
          'Whisk the flour, baking soda and salt in a second bowl, add to the butter mixture and stir in the chocolate chips.',
          'Cover the dough and chill it in the fridge for at least 1 hour.',
          'Let the dough stand at room temperature for 10 minutes and preheat the oven to 350°F.',
          'Scoop the dough into balls and space them 3 inches apart on lined baking sheets.',
          'Bake for 11–12 minutes, until the edges just start to turn golden.',
          'Cool on the sheet for 5 minutes, then move the cookies to a rack.'
        ],
        prep: 75,
        cook: 12,
        total: 90,
        groups: [
          { name: null, start: 0, count: 8 },
          { name: 'Filling', start: 8, count: 2 }
        ],
        servings: '24 cookies',
        nutrition: { calories: 270, fat: 13, carbs: 34, protein: 4, servingSize: '1 cookie' },
        source: 'https://example.com/cookies'
      }
    };
    (function () {
      const store = {
        log: [{ url: 'https://example.com/a' }, { url: 'https://example.com/b' }],
        misses: [{ url: 'https://example.com/c' }],
        devLogging: true
      };
      const listeners = [];
      window.chrome = {
        storage: {
          local: {
            get: async keys => {
              if (!keys || Array.isArray(keys) || typeof keys === 'string') return { ...store };
              const out = { ...keys };
              for (const k of Object.keys(keys)) if (k in store) out[k] = store[k];
              return out;
            },
            set: async items => {
              const changes = {};
              for (const [k, v] of Object.entries(items)) {
                changes[k] = { oldValue: store[k], newValue: v };
                store[k] = v;
              }
              for (const cb of listeners) cb(changes, 'local');
            }
          },
          onChanged: { addListener: cb => listeners.push(cb) }
        },
        alarms: { create: () => {}, clear: () => {} }
      };
    })();
  </script>
</head>
<body>
  <div id="empty" class="empty hidden">
    <p>Nothing to cook yet. Open a recipe and use the Cook button, or pick one you saved.</p>
    <button id="empty-library" class="action">Saved recipes</button>
  </div>
  <div id="app" class="hidden">
    <header class="top">
      <div>
        <p class="eyebrow">Cook mode</p>
        <h1 id="name"></h1>
        <p id="meta" class="meta"></p>
        <div class="controls">
          <div class="group" id="system">
            <button data-system="imperial">Imperial</button>
            <button data-system="metric">Metric</button>
          </div>
          <div class="group" id="scale">
            <button data-factor="1/4">¼×</button>
            <button data-factor="1/3">⅓×</button>
            <button data-factor="1/2">½×</button>
            <button data-factor="1">1×</button>
            <button data-factor="2">2×</button>
            <button data-factor="3">3×</button>
          </div>
        </div>
      </div>
      <div class="top-side">
        <div class="actions">
          <button id="save" class="action">Save</button>
          <button id="copy" class="action">Copy as Markdown</button>
          <button id="print" class="action">Print</button>
          <button id="library-open" class="action">Saved recipes<span id="saved-count" class="count"></span></button>
        </div>
        <span id="awake" class="awake hidden">Screen stays on</span>
      </div>
    </header>
    <main class="layout">
      <aside class="panel">
        <h2>Ingredients <span id="ing-count" class="count"></span></h2>
        <ul id="ingredients" class="ing"></ul>
      </aside>
      <section class="focus">
        <p id="step-count" class="step-count"></p>
        <p id="step-text" class="step-text"></p>
        <div id="step-timers" class="step-timers"></div>
        <div class="nav">
          <button id="prev" class="ghost">Previous</button>
          <button id="next" class="primary">Next step</button>
        </div>
        <p class="keys">Arrow keys or space to move between steps</p>
        <ol id="overview" class="overview"></ol>
      </section>
    </main>
  </div>
  <div id="drawer" class="drawer hidden" role="dialog" aria-label="Saved recipes">
    <div class="drawer-panel">
      <header class="drawer-head">
        <h2>Saved recipes</h2>
        <button id="library-close" class="action">Close</button>
      </header>
      <input id="lib-search" class="search" type="search" placeholder="Search by name or ingredient">
      <ul id="lib-list" class="lib-list"></ul>
      <p id="lib-empty" class="lib-empty hidden"></p>
    </div>
  </div>
  <div id="dock" class="dock"></div>
  <script src="../lib/parser.js"></script>
  <script src="../lib/convert.js"></script>
  <script src="../lib/extractor.js"></script>
  <script src="../lib/timers.js"></script>
  <script src="../lib/library.js"></script>
  <script src="../lib/markdown.js"></script>
  <script src="../cook/cook.js"></script>
  <script>
    if (new URLSearchParams(location.search).get('demo')) {
      document.head.insertAdjacentHTML('beforeend', '<style>.dock-bar { display: none; }</style>');
      setTimeout(async () => {
        for (let i = 0; i < 5; i++) document.getElementById('next').click();
        for (const box of [...document.querySelectorAll('.ing input')].slice(0, 6)) box.click();
        await RC.timers.start({ key: 'https://example.com/cookies|2|0', label: 'Step 3 · 1 hr', recipe: 'Soft Chocolate Chip Cookies', seconds: 2537 });
        await RC.timers.start({ key: 'https://example.com/cookies|5|0', label: 'Step 6 · 11 min', recipe: 'Soft Chocolate Chip Cookies', seconds: 512 });
        if (document.activeElement) document.activeElement.blur();
      }, 300);
    }
  </script>
</body>
</html>
